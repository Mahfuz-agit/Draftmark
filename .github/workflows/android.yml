name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          npx cap init Draftmark com.draftmark.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Fix Bouncy Castle Jar Cache Bug
        run: |
          # সমস্যাযুক্ত 1.79 ভার্সনটি ওভাররাইড করে স্টেবল 1.77 ভার্সন ফোর্স করা হলো
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy {" >> android/build.gradle
          echo "            force 'org.bouncycastle:bcprov-jdk18on:1.77'" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: draftmark-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
