name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: npm run build

      - name: Initialize Capacitor & Add Android
        run: |
          npx cap init Draftmark com.draftmark.app --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle (No Daemon Mode)
        run: |
          cd android
          chmod +x gradlew
          # `--no-daemon` এবং `--refresh-dependencies` দিয়ে ফাইল লক ও জার ক্রিয়েশন এরর চিরতরে দূর করা হলো
          ./gradlew clean assembleDebug --no-daemon --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: draftmark-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
